the passenger seat of the white car outside the Gas-N-Sip in the rain."},"routes":12,"tally":{"phone":2,"brittney":6,"alone":4}};
const S=D.story, esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let steps=[];const KEY='rtr.mercer-playtest.'+S.version;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(s))steps=s;}catch{}
function state(){let node=null,entry=null,hist=[];for(const s of steps){if(s.entry){entry=S.entries.find(e=>e.id===s.entry);node=entry.to;hist.push({node,beats:S.nodes[node].beats});}else if(s.choice){const c=(S.nodes[node].choices||[]).find(c=>c.id===s.choice);hist.push({node,beats:[{speaker:'Player',text:c.label}],choice:true,draft:c.draft});node=c.to;hist.push({node,beats:S.nodes[node].beats});}else{node=S.nodes[node].next;hist.push({node,beats:S.nodes[node].beats});}}return{node,entry,hist};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(steps));}catch{}}
function beat(b,draft){return b.speaker==='Scene'?'<div class="beat scene"><p>'+esc(b.text)+'</p></div>':'<div class="beat"><span class="who">'+esc(b.speaker)+(draft?'<span class="draftTag">Draft</span>':'')+'</span><p>'+esc(b.text)+'</p></div>';}
function render(){const st=state(),art=document.getElementById('art'),card=document.getElementById('card'),ch=document.getElementById('choices'),nx=document.getElementById('next');
 document.getElementById('back').disabled=!steps.length;document.getElementById('restart').hidden=!steps.length;
 if(!st.node){document.getElementById('stage').textContent='Choose how Seattle ended';art.src=D.images.counter;art.alt=D.alts.counter;
  card.innerHTML='<p>Brittney\'s scene depends on how Seattle went. Pick a starting point.</p>';
  ch.innerHTML='<div class="entry">'+S.entries.map(e=>'<button data-entry="'+e.id+'"><strong>'+esc(e.label)+'</strong><small>'+esc(e.detail)+'</small></button>').join('')+'</div>';
  nx.hidden=true;document.getElementById('status').textContent='';document.getElementById('transcript').innerHTML='';return;}
 const n=S.nodes[st.node];document.getElementById('stage').textContent=(st.entry?st.entry.label+' · ':'')+n.stage;
 art.src=D.images[n.art];art.alt=D.alts[n.art];
 const last=st.hist[st.hist.length-1],prev=st.hist[st.hist.length-2];
 let body=(prev&&prev.choice?beat(prev.beats[0],prev.draft):'')+n.beats.map((b,i)=>beat(b,n.draft&&(n.draftBeats||[]).includes(i))).join('');
 if(n.review){const r=S.issues.find(i=>i.id===n.review);body+='<p class="review">Review: '+esc(r.title)+'. '+esc(r.detail)+'</p>';}
 card.innerHTML=body||'<p class="stage">Choose what Ralphy says.</p>';
 ch.innerHTML=(n.choices||[]).map(c=>'<button class="choice" data-choice="'+c.id+'">'+(c.draft?'<span class="draftTag" style="margin:0 6px 0 0">Draft</span>':'')+esc(c.label)+(c.note?'<small>'+esc(c.note)+'</small>':'')+'</button>').join('');
 nx.hidden=!!n.ending||!!(n.choices&&n.choices.length);nx.textContent=n.advanceLabel||'Continue';
 document.getElementById('status').textContent=n.ending?'Route complete · '+D.endings[n.ending]:'';
 document.getElementById('transcript').innerHTML=st.hist.flatMap(h=>h.beats.map(b=>'<p>'+(b.speaker==='Scene'?'<em>'+esc(b.text)+'</em>':'<strong>'+esc(b.speaker)+':</strong> '+esc(b.text))+'</p>')).join('');}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.entry)steps.push({entry:t.dataset.entry});else if(t.dataset.choice)steps.push({choice:t.dataset.choice});
 else if(t.id==='next')steps.push({next:true});else if(t.id==='back')steps.pop();else if(t.id==='restart')steps=[];else return;save();render();scrollTo({top:0,behavior:'smooth'});});
document.getElementById('reviewHead').textContent='Open review items · '+D.routes+' routes checked';
document.getElementById('reviewList').innerHTML='<ul>'+S.issues.map(i=>'<li><strong>'+esc(i.title)+'.</strong> '+esc(i.detail)+'</li>').join('')+'</ul>';
try{state();}catch{steps=[];}
render();
</script></body></html>
