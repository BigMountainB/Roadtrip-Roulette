<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadside NPCs</title>
<style>
:root{--bg:#f6f4ef;--fg:#1c1b19;--muted:#6b6760;--card:#fff;--line:#dcd7cc;--accent:#2d6cdf;--draft:#a5560f;--btn:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f1efe9;--muted:#a19d95;--card:#222226;--line:#36363c;--accent:#7fa8ff;--draft:#f0a35c;--btn:#2a2a2f}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#f1efe9;--muted:#a19d95;--card:#222226;--line:#36363c;--accent:#7fa8ff;--draft:#f0a35c;--btn:#2a2a2f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.25rem;margin:0 0 4px}.source{color:var(--muted);font-size:.8rem;margin:0 0 12px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{font:inherit;font-size:.85rem;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input{font:inherit;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0}.where{color:var(--muted);font-size:.8rem;margin:0 0 8px}
.node{color:var(--muted);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px}
.line{margin:0 0 8px;overflow-wrap:anywhere}.line .lt{color:var(--muted);font-size:.78rem;display:block}
.choice{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line);overflow-wrap:anywhere}
.choice .say{font-weight:600}.choice .resp{display:block}.choice small{display:block;color:var(--muted);font-size:.78rem}
.count{color:var(--muted);font-size:.85rem;margin:0 0 12px}
</style></head><body><main>
<h1>Roadside NPCs, shops &amp; chatter</h1>
<p class="source" id="source"></p>
<div class="filters" id="filters"></div>
<input id="q" type="search" placeholder="Search lines, speakers, stops…" aria-label="Search">
<p class="count" id="count"></p>
<div id="list"></div>
</main>
<script>
const D=__DATA__;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cat='All';
document.getElementById('source').textContent=D.source;
const cats=['All',...new Set(D.groups.map(g=>g.category))];
function card(g){let h='<div class="card"><h2>'+esc(g.speaker)+'</h2><p class="where">'+esc(g.category)+(g.where?' · '+esc(g.where):'')+'</p>';
  let lastNode=null;
  for(const r of g.rows){if(r.node&&r.node!==lastNode){h+='<div class="node">'+esc(r.node)+'</div>';lastNode=r.node;}
    if(r.type==='Choice')h+='<div class="choice"><span class="say">'+esc(r.text)+'</span>'+(r.response?'<span class="resp">→ '+esc(r.response)+'</span>':'')+((r.cost||r.effect)?'<small>'+esc([r.cost,r.effect].filter(Boolean).join(' · '))+'</small>':'')+'</div>';
    else h+='<p class="line"><span class="lt">'+esc(r.type)+'</span>'+esc(r.text)+(r.response?'<br>→ '+esc(r.response):'')+((r.cost||r.effect)?'<br><small style="color:var(--muted)">'+esc([r.cost,r.effect].filter(Boolean).join(' · '))+'</small>':'')+'</p>';}
  return h+'</div>';}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();
  const gs=D.groups.filter(g=>(cat==='All'||g.category===cat)&&(!q||JSON.stringify(g).toLowerCase().includes(q)));
  document.getElementById('filters').innerHTML=cats.map(c=>'<button aria-pressed="'+(c===cat)+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');
  document.getElementById('count').textContent=gs.length+' of '+D.groups.length+' speakers · '+gs.reduce((n,g)=>n+g.rows.length,0)+' lines';
  document.getElementById('list').innerHTML=gs.map(card).join('');}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(b){cat=b.dataset.cat;render();}});
document.getElementById('q').addEventListener('input',render);
const ap=matchMedia('(prefers-color-scheme: dark)');const th=()=>document.documentElement.dataset.theme=ap.matches?'dark':'light';th();ap.addEventListener('change',th);
render();
</script></body></html>
