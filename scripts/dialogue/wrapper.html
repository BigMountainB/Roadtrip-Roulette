<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Story Playtest</title>
<style>
:root{--bg:#f6f4ef;--fg:#1c1b19;--muted:#6b6760;--line:#dcd7cc;--chip:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#17171a;--fg:#f1efe9;--muted:#a19d95;--line:#36363c;--chip:#232327}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:12px 16px}
h1{font-size:1rem;margin:0 0 8px;font-weight:600}h1 span{color:var(--muted);font-weight:400}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
nav button{min-width:0;font:inherit;text-align:left;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer}
nav button small{display:block;color:var(--muted);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){nav button{padding:8px 10px;font-size:.9rem}nav button small{display:none}}nav button b{font-weight:600}
nav button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}nav button[aria-current="true"] small{color:var(--bg);opacity:.75}
iframe{display:block;width:100%;border:0;min-height:80vh}iframe[hidden]{display:none}
</style></head><body>
<header><div class="bar"><h1>Road Trip Roulette <span>· story playtest</span></h1><nav id="nav"></nav></div></header>
<main id="frames"></main>
__PAGES__<script>
const CHAPTERS=__CHAPTERS__, SEATTLE_KEY="rtr.seattle-illustrated-playtest.2026-10-30";
const pages={};const page=id=>pages[id]??=JSON.parse(document.getElementById('page-'+id).textContent);
const frames={};
function build(ch){
  let src=page(ch.page);
  if(ch.key)src=src.split(SEATTLE_KEY).join(ch.key);              // separate save per chapter
  if(ch.start)src=src.replace('"start":"intro1"','"start":"'+ch.start+'"');
  const f=document.createElement('iframe');f.title=ch.title;f.srcdoc=src;
  f.addEventListener('load',()=>{const d=f.contentDocument;const fit=()=>{f.style.height=(d.documentElement.scrollHeight+8)+'px';};
    fit();new ResizeObserver(fit).observe(d.body);d.addEventListener('click',()=>setTimeout(fit,30),true);});
  document.getElementById('frames').appendChild(f);return f;
}
function show(id){
  const ch=CHAPTERS.find(c=>c.id===id)||CHAPTERS[0];
  for(const [k,f] of Object.entries(frames))f.hidden=k!==ch.id;
  (frames[ch.id]??=build(ch)).hidden=false;
  for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-current',b.dataset.id===ch.id);
  try{localStorage.setItem('rtr.story-playtest.chapter',ch.id);}catch{}
  scrollTo({top:0});
}
document.getElementById('nav').innerHTML=CHAPTERS.map((c,i)=>'<button data-id="'+c.id+'"><b>'+(i+1)+' · '+c.title+'</b><small>'+c.sub+'</small></button>').join('');
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.id);});
let last=null;try{last=localStorage.getItem('rtr.story-playtest.chapter');}catch{}
show(last||'hospital');
</script></body></html>
