<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f4ef;--fg:#1c1b19;--muted:#6b6760;--card:#fff;--line:#dcd7cc;--accent:#2d6cdf;--draft:#a5560f;--btn:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f1efe9;--muted:#a19d95;--card:#222226;--line:#36363c;--accent:#7fa8ff;--draft:#f0a35c;--btn:#2a2a2f}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#f1efe9;--muted:#a19d95;--card:#222226;--line:#36363c;--accent:#7fa8ff;--draft:#f0a35c;--btn:#2a2a2f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.25rem;margin:0}.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}.stage{color:var(--muted);font-size:.9rem;text-align:right}
.source{color:var(--muted);font-size:.8rem;margin:0 0 12px}
@media (max-width:480px){.top{display:block}.stage{display:block;text-align:left;margin-top:4px}}
figure{margin:0 0 12px}img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000}
figcaption{color:var(--muted);font-size:.8rem;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.beat+.beat{margin-top:10px}.who{display:block;font-weight:600;font-size:.85rem;color:var(--muted)}.beat p{margin:2px 0 0;overflow-wrap:anywhere}
.scene p{font-style:italic;color:var(--muted)}.prompt{color:var(--muted);margin:0}
.tag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--draft);border:1px solid var(--draft);border-radius:6px;padding:0 6px;margin-left:6px;font-style:normal}
.choices{display:grid;gap:8px;margin-bottom:12px}
button{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer;text-align:left}
button:hover{border-color:var(--accent)}button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button[disabled]{opacity:.4;cursor:default}.choice small,.entry small{display:block;color:var(--muted);font-size:.78rem}
button.scenario{border-style:dashed}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.status{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.status b{color:var(--fg)}
details{margin:10px 0}summary{font-weight:600;cursor:pointer}details>div{padding-top:8px}details li{margin-bottom:8px}
.review{font-size:.85rem;color:var(--draft);margin-top:10px}
.entry{display:grid;gap:8px}
table{border-collapse:collapse;font-size:.85rem}td{padding:2px 12px 2px 0;vertical-align:top}td:first-child{color:var(--muted)}
.extra h3{font-size:.95rem;margin:14px 0 6px}.extra p{margin:0 0 8px;overflow-wrap:anywhere}.extra small{color:var(--muted)}
</style></head><body><main>
<div class="top"><h1 id="title"></h1><span class="stage" id="stage"></span></div>
<p class="source" id="source"></p>
<figure id="fig"><img id="art" alt="" width="960" height="540"><figcaption id="figcap"></figcaption></figure>
<div class="card" id="card"></div>
<div class="choices" id="choices"></div>
<div class="controls"><button class="primary" id="next">Continue</button><button id="back">Back</button><button id="restart">Start again</button></div>
<p class="status" id="status"></p>
<details><summary>Read the conversation so far</summary><div id="transcript"></div></details>
<details><summary>What this route remembers</summary><div><table><tbody id="memory"></tbody></table></div></details>
<details id="extrasBox"><summary id="extrasHead">More lines in this chapter</summary><div class="extra" id="extras"></div></details>
<details><summary id="reviewHead">Open review items</summary><div id="reviewList"></div></details>
</main>
<script>
const D=__DATA__;
const S=D.story,esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='rtr.story-player.'+S.id+'.'+S.version;let steps=[];
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(s))steps=s;}catch{}
// ── conditions: {key: value} equal · {key: [a,b]} one of · {key: {gte|gt|lte|lt|ne: n}}
function test(c,v){if(Array.isArray(c))return c.includes(v);if(c&&typeof c==='object'){
  if('gte' in c&&!(v>=c.gte))return false;if('gt' in c&&!(v>c.gt))return false;if('lte' in c&&!(v<=c.lte))return false;
  if('lt' in c&&!(v<c.lt))return false;if('ne' in c&&v===c.ne)return false;return true;}return v===c;}
const ok=(when,m)=>!when||Object.entries(when).every(([k,c])=>test(c,m[k]));
function apply(o,m){if(!o)return;for(const [k,v] of Object.entries(o.set||{}))m[k]=v;for(const [k,v] of Object.entries(o.add||{}))m[k]=(m[k]||0)+v;}
function enter(id,m){let guard=0;while(S.nodes[id]&&S.nodes[id].route&&guard++<20){apply(S.nodes[id],m);const r=S.nodes[id].route.find(r=>ok(r.when,m));id=r.to;}apply(S.nodes[id],m);return id;}
const beatsOf=(n,m)=>(n.beats||[]).filter(b=>ok(b.when,m));
const choicesOf=(n,m)=>(n.choices||[]).filter(c=>ok(c.when,m));
function state(){const m={...S.initial};let node=null,entry=null;const hist=[];
  for(const s of steps){
    if(s.entry){entry=S.entries.find(e=>e.id===s.entry);apply(entry,m);node=enter(entry.to,m);hist.push({node,beats:beatsOf(S.nodes[node],m)});}
    else if(s.choice){const c=choicesOf(S.nodes[node],m).find(c=>c.id===s.choice);if(!c)throw new Error('bad step');
      if(!c.scenario)hist.push({node,beats:[{speaker:'Player',text:c.label}],choice:true});else hist.push({node,beats:[],scenario:c.label});
      apply(c,m);node=enter(c.to,m);hist.push({node,beats:beatsOf(S.nodes[node],m)});}
    else{node=enter(S.nodes[node].next,m);hist.push({node,beats:beatsOf(S.nodes[node],m)});}}
  return{node,entry,hist,m};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(steps));}catch{}}
const isHole=t=>/^\[(OWNER|caption pending)/.test(t)||/\[(OWNER|caption pending)/.test(t);
function beat(b){const tag=isHole(b.text)?'<span class="tag">Placeholder</span>':'';
  return b.speaker==='Scene'?'<div class="beat scene"><p>'+esc(b.text)+tag+'</p></div>'
  :'<div class="beat"><span class="who">'+esc(b.speaker)+tag+'</span><p>'+esc(b.text)+'</p></div>';}
function setArt(key){const fig=document.getElementById('fig'),art=document.getElementById('art');
  const src=key&&D.images[key];fig.hidden=!src;if(src){art.src=src;art.alt=(D.alts&&D.alts[key])||'';document.getElementById('figcap').textContent=D.figcaption||'';}}
function render(){const st=state(),card=document.getElementById('card'),ch=document.getElementById('choices'),nx=document.getElementById('next');
  document.getElementById('back').disabled=!steps.length;document.getElementById('restart').hidden=!steps.length;
  const mem=document.getElementById('memory');mem.innerHTML=Object.entries(st.m).filter(([k])=>D.memory&&D.memory[k]).map(([k,v])=>'<tr><td>'+esc(D.memory[k])+'</td><td>'+esc(v===undefined||v===null?'—':v)+'</td></tr>').join('')||'<tr><td>Nothing yet.</td></tr>';
  if(!st.node){document.getElementById('stage').textContent=S.startStage||'Choose a starting point';setArt(S.startArt);
    card.innerHTML='<p class="prompt">'+esc(S.startPrompt||'Pick a starting point.')+'</p>';
    ch.innerHTML='<div class="entry">'+S.entries.map(e=>'<button data-entry="'+e.id+'"><strong>'+esc(e.label)+'</strong><small>'+esc(e.detail||'')+'</small></button>').join('')+'</div>';
    nx.hidden=true;document.getElementById('status').textContent='';document.getElementById('transcript').innerHTML='';return;}
  const n=S.nodes[st.node];document.getElementById('stage').textContent=n.stage||'';setArt(n.art);
  const prev=st.hist[st.hist.length-2];
  let body=(prev&&prev.choice?beat(prev.beats[0]):'')+(prev&&prev.scenario?'<p class="prompt">Scenario: '+esc(prev.scenario)+'</p>':'')
    +beatsOf(n,st.m).map(beat).join('');
  if(n.prompt)body+='<p class="prompt"'+(body?' style="margin-top:10px"':'')+'>'+esc(n.prompt)+'</p>';
  if(n.review){const r=S.issues.find(i=>i.id===n.review);if(r)body+='<p class="review">Review: '+esc(r.title)+'. '+esc(r.detail)+'</p>';}
  card.innerHTML=body||'<p class="prompt">Choose what Ralphy says.</p>';
  ch.innerHTML=choicesOf(n,st.m).map(c=>'<button class="choice'+(c.scenario?' scenario':'')+'" data-choice="'+c.id+'">'+(c.scenario?'<span class="tag" style="margin:0 6px 0 0">Scenario</span>':'')+esc(c.label)+(c.note?'<small>'+esc(c.note)+'</small>':'')+'</button>').join('');
  nx.hidden=!!n.ending||!!(n.choices&&n.choices.length)||!n.next;nx.textContent=n.advanceLabel||'Continue';
  document.getElementById('status').innerHTML=n.ending?'Route complete · <b>'+esc(n.ending)+'</b>'+(n.endingNote?' · '+esc(n.endingNote):''):'';
  document.getElementById('transcript').innerHTML=st.hist.flatMap(h=>h.beats.map(b=>'<p>'+(b.speaker==='Scene'?'<em>'+esc(b.text)+'</em>':'<strong>'+esc(b.speaker)+':</strong> '+esc(b.text))+'</p>')).join('');}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.entry)steps.push({entry:t.dataset.entry});else if(t.dataset.choice)steps.push({choice:t.dataset.choice});
  else if(t.id==='next')steps.push({next:true});else if(t.id==='back')steps.pop();else if(t.id==='restart')steps=[];else return;save();render();scrollTo({top:0,behavior:'smooth'});});
document.getElementById('title').textContent=S.title;document.getElementById('source').textContent=S.source||'';
document.getElementById('reviewHead').textContent='Open review items · '+S.issues.length;
document.getElementById('reviewList').innerHTML='<ul>'+S.issues.map(i=>'<li><strong>'+esc(i.title)+'.</strong> '+esc(i.detail)+'</li>').join('')+'</ul>';
const X=S.extras||[];document.getElementById('extrasBox').hidden=!X.length;
document.getElementById('extras').innerHTML=X.map(g=>'<h3>'+esc(g.title)+'</h3>'+(g.note?'<p><small>'+esc(g.note)+'</small></p>':'')+g.items.map(i=>'<p>'+(i.speaker&&i.speaker!=='Scene'?'<strong>'+esc(i.speaker)+':</strong> ':'')+(i.speaker==='Scene'?'<em>'+esc(i.text)+'</em>':esc(i.text))+(isHole(i.text)?'<span class="tag">Placeholder</span>':'')+(i.note?'<br><small>'+esc(i.note)+'</small>':'')+'</p>').join('')).join('');
const ap=matchMedia('(prefers-color-scheme: dark)');const th=()=>document.documentElement.dataset.theme=ap.matches?'dark':'light';th();ap.addEventListener('change',th);
try{state();}catch{steps=[];}
render();
</script></body></html>
