name: Deploy to Cloudflare Pages

# ⚠️ READ THIS BEFORE CHANGING THE DEPLOY PATH (owner decision 2026-08-10)
#
# This workflow deploys `website/` — NOT `dist/`. That distinction is the whole
# reason this comment exists.
#
#   website/  = the landing page AND the game.  /demo and /fully are real game
#               builds produced by the two build scripts below. This is what
#               `scripts/deploy.sh` ships and what is live today.
#   dist/     = the bare vite build. No /demo, no /fully, no landing page.
#
# Until 2026-08-10 this workflow deployed `dist` to the SAME Pages project the
# real site uses. Because a Pages deploy REPLACES the project rather than
# merging into it, a single successful CI run would have wiped the landing page,
# /faq, /genres, /story, /map, /walkthrough, /leaderboard, /businesses, /demo
# and /fully, leaving only the bare game at the root.
#
# It never fired only because the CF_PAGES_API_TOKEN secret is dead — every run
# failed at `Authentication error [code: 10000]` before reaching the deploy
# step. In other words the site was protected by a broken credential, and the
# obvious "fix the red X" (add the secrets) was the thing that would have
# detonated it. Pointing this at `website/` defuses that: adding the secrets is
# now safe, and makes push-to-main auto-deploy the real site.
#
# Keep this in step with `scripts/deploy.sh` — that script is the manual path
# and the two must not drift.

on:
  push:
    branches:
      - main
  workflow_dispatch:   # manual re-run

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Both bundles are rebuilt from source every run, deliberately. They were
      # hand-built once in July and silently went stale for days — /demo kept
      # shipping old assets while the main game moved on. Rebuilding is the only
      # thing that makes drift impossible. Each script runs its own `vite build`,
      # so there is no separate `npm run build` step.
      - name: Build the demo game bundle
        run: sh website/build-demo.sh

      - name: Build the full game bundle
        run: sh website/build-fully.sh

      # No-op once the project exists; `|| true` keeps it from failing the run.
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create roadtrip-roulette --production-branch=main || true

      # A plain `run:` step with env: — the cloudflare/pages-action@v1 and
      # cloudflare/wrangler-action@v3 both failed to forward the API token.
      - name: Deploy website/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@3 pages deploy website --project-name=roadtrip-roulette --branch=main --commit-dirty=true
